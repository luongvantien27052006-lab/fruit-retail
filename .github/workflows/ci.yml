# CI (CP02, Tiến chọn GitHub Actions). Action pin theo commit SHA. Không có secret nào được dùng.
name: ci

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Quét secret (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --redact --no-banner --exit-code 1

  ts:
    name: TS — lint, typecheck, test, build, hợp đồng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.22.3 }
      - run: corepack enable
      - run: node tools/check-versions.mjs node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: test (PostgreSQL/Redis thật qua Testcontainers)
        run: pnpm run test
      - run: pnpm run build
      - run: pnpm run check:contracts

  dart:
    name: Dart/Flutter — sinh client, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.22.3 }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: 3.44.6, channel: stable }
      - run: node tools/check-versions.mjs flutter dart
      - run: corepack enable && pnpm install --frozen-lockfile --filter @fruit/contracts
      - run: pnpm --filter @fruit/contracts run export:dart
      - run: flutter pub get --enforce-lockfile
      - name: sinh shared_models
        working-directory: packages/shared_models
        run: dart run swagger_parser && dart run build_runner build
      - name: analyze + test
        run: |
          set -e
          for p in packages/money_weight/dart packages/shared_models; do (cd "$p" && dart analyze --fatal-infos && dart test); done
          for a in apps/customer_app apps/staff_app; do (cd "$a" && flutter analyze --fatal-infos && flutter test); done

  windows:
    name: staff_app — build Windows + spike COM
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: 3.44.6, channel: stable }
      - run: flutter pub get --enforce-lockfile
      - working-directory: apps/staff_app
        run: flutter build windows --release
      - working-directory: apps/staff_app
        run: flutter test integration_test -d windows
