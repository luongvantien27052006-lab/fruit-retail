# docker compose cho dev local (SPEC §19.3, ADR-010/017). Chạy từ gốc repo:
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
# infra/.env tạo từ infra/.env.example (KHÔNG commit). Production/staging dùng override riêng ở CP02 phần VPS.
name: fruit-retail

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: fruit
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD:?PG_OWNER_PASSWORD bắt buộc}
    volumes: [pgdata:/var/lib/postgresql/data]
    # Máy dev có thể đã chạy PostgreSQL khác ở 5432 → mặc định mở ra 25432 (55432 thường bị dự án khác dùng).
    ports: ["127.0.0.1:${PG_HOST_PORT:-25432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d fruit"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db-bootstrap:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    image: fruit-retail/api:local
    command: ["node", "dist/db-bootstrap.js"]
    environment:
      DATABASE_URL_MIGRATE: postgresql://owner:${PG_OWNER_PASSWORD}@postgres:5432/fruit
      SQL_DIR: infra/sql
      PG_APP_RW_PASSWORD: ${PG_APP_RW_PASSWORD:?bắt buộc}
      PG_PROJECTOR_RW_PASSWORD: ${PG_PROJECTOR_RW_PASSWORD:?bắt buộc}
      PG_VIEWER_RO_PASSWORD: ${PG_VIEWER_RO_PASSWORD:?bắt buộc}
      PG_VIEWER_ACT_PASSWORD: ${PG_VIEWER_ACT_PASSWORD:?bắt buộc}
      PG_AUDIT_WRITER_PASSWORD: ${PG_AUDIT_WRITER_PASSWORD:?bắt buộc}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: fruit-retail/api:local
    command: ["node", "dist/main.js"]
    environment: &app_env
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL_APP: postgresql://app_rw:${PG_APP_RW_PASSWORD}@postgres:5432/fruit
      DATABASE_URL_PROJECTOR: postgresql://projector_rw:${PG_PROJECTOR_RW_PASSWORD}@postgres:5432/fruit
      DATABASE_URL_VIEWER: postgresql://viewer_ro:${PG_VIEWER_RO_PASSWORD}@postgres:5432/fruit
      DATABASE_URL_VIEWER_ACT: postgresql://viewer_act:${PG_VIEWER_ACT_PASSWORD}@postgres:5432/fruit
      DATABASE_URL_AUDIT: postgresql://audit_writer:${PG_AUDIT_WRITER_PASSWORD}@postgres:5432/fruit
      REDIS_URL: redis://redis:6379
      TZ: Asia/Ho_Chi_Minh
      BUSINESS_DAY_CUTOFF: "04:00"
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    image: fruit-retail/api:local
    command: ["node", "dist/worker.js"]
    environment: *app_env
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes: [./caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro, caddydata:/data]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
  caddydata: {}
