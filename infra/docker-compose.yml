# docker compose cho dev local (SPEC §19.3, ADR-010/011/017). Chạy từ gốc repo:
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build --wait
# infra/.env tạo từ infra/.env.example (KHÔNG commit). Staging/production dùng override riêng (CP02 phần VPS):
# pin image theo digest, owner không phải superuser cho runtime, HTTPS + HSTS, Redis ACL.
name: fruit-retail

x-hardening: &hardening
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]

services:
  postgres:
    image: postgis/postgis:17-3.5
    # Image cần vài capability để chuyển user/chown thư mục dữ liệu.
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: fruit
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD:?PG_OWNER_PASSWORD bắt buộc}
    volumes: [pgdata:/var/lib/postgresql/data]
    # Máy dev có thể đã chạy PostgreSQL khác ở 5432 → mặc định mở ra 25432 (55432 thường bị dự án khác dùng).
    ports: ['127.0.0.1:${PG_HOST_PORT:-25432}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U owner -d fruit']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    # entrypoint của image chown /data rồi hạ quyền xuống user redis → cần CHOWN/SETGID/SETUID.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    # ACL theo user (ADR-029): default TẮT; ops toàn quyền (vận hành); api chỉ rl:*; worker chỉ bull:*; không lệnh nguy hiểm
    entrypoint: ['sh', '/usr/local/bin/fruit-redis-start.sh']
    command: ['--appendonly', 'yes', '--appendfsync', 'everysec', '--maxmemory-policy', 'noeviction']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD bắt buộc (user ops)}
      REDIS_API_PASSWORD: ${REDIS_API_PASSWORD:?REDIS_API_PASSWORD bắt buộc — xem infra/.env.example}
      REDIS_WORKER_PASSWORD: ${REDIS_WORKER_PASSWORD:?REDIS_WORKER_PASSWORD bắt buộc — xem infra/.env.example}
    volumes:
      - redisdata:/data
      - ./redis/start.sh:/usr/local/bin/fruit-redis-start.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_API_PASSWORD" redis-cli --user api ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db-bootstrap:
    <<: *hardening
    build: { context: .., dockerfile: apps/api/Dockerfile }
    image: fruit-retail/api:${IMAGE_TAG:-local}
    command: ['node', 'dist/db-bootstrap.js']
    environment:
      NODE_ENV: development
      DATABASE_URL_MIGRATE: postgresql://owner:${PG_OWNER_PASSWORD}@postgres:5432/fruit
      SQL_DIR: infra/sql
      PG_OWNER_PASSWORD: ${PG_OWNER_PASSWORD}
      PG_APP_RW_PASSWORD: ${PG_APP_RW_PASSWORD:?bắt buộc}
      PG_PROJECTOR_RW_PASSWORD: ${PG_PROJECTOR_RW_PASSWORD:?bắt buộc}
      PG_VIEWER_RO_PASSWORD: ${PG_VIEWER_RO_PASSWORD:?bắt buộc}
      PG_VIEWER_ACT_PASSWORD: ${PG_VIEWER_ACT_PASSWORD:?bắt buộc}
      PG_AUDIT_WRITER_PASSWORD: ${PG_AUDIT_WRITER_PASSWORD:?bắt buộc}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  # API: chỉ giữ URL của role nó dùng (app_rw, viewer_ro, viewer_act, audit_writer) — không có projector_rw (ADR-011).
  api:
    <<: *hardening
    image: fruit-retail/api:${IMAGE_TAG:-local}
    command: ['node', 'dist/main.js']
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL_APP: postgresql://app_rw:${PG_APP_RW_PASSWORD}@postgres:5432/fruit
      DATABASE_URL_VIEWER: postgresql://viewer_ro:${PG_VIEWER_RO_PASSWORD}@postgres:5432/fruit
      DATABASE_URL_VIEWER_ACT: postgresql://viewer_act:${PG_VIEWER_ACT_PASSWORD}@postgres:5432/fruit
      DATABASE_URL_AUDIT: postgresql://audit_writer:${PG_AUDIT_WRITER_PASSWORD}@postgres:5432/fruit
      REDIS_URL: redis://api:${REDIS_API_PASSWORD}@redis:6379
      TZ: Asia/Ho_Chi_Minh
      BUSINESS_DAY_CUTOFF: '04:00'
      # Khóa xác thực (ADR-012/015/021) — chỉ API có; thiếu/sai ⇒ API không khởi động
      JWT_SIGNING_KEYS: ${JWT_SIGNING_KEYS:?bắt buộc — xem infra/.env.example}
      PII_ENC_KEYS: ${PII_ENC_KEYS:?bắt buộc — xem infra/.env.example}
      PII_HASH_PEPPER: ${PII_HASH_PEPPER:?bắt buộc — xem infra/.env.example}
      # OTP khách (ADR-023): trống ⇒ route OTP 503; dev có thể đặt TEST_DOUBLE
      OTP_PROVIDER: ${OTP_PROVIDER:-}
      # File (ADR-014/025): trống ⇒ /files/* 503
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/v1/health']
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Worker: app_rw (consumer nghiệp vụ) + projector_rw (projection) — không có URL viewer (ADR-011).
  worker:
    <<: *hardening
    image: fruit-retail/api:${IMAGE_TAG:-local}
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: development
      DATABASE_URL_APP: postgresql://app_rw:${PG_APP_RW_PASSWORD}@postgres:5432/fruit
      DATABASE_URL_PROJECTOR: postgresql://projector_rw:${PG_PROJECTOR_RW_PASSWORD}@postgres:5432/fruit
      REDIS_URL: redis://worker:${REDIS_WORKER_PASSWORD}@redis:6379
      TZ: Asia/Ho_Chi_Minh
      BUSINESS_DAY_CUTOFF: '04:00'
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  admin-web:
    <<: *hardening
    build: { context: .., dockerfile: apps/admin-web/Dockerfile }
    image: fruit-retail/admin-web:${IMAGE_TAG:-local}
    environment:
      # BFF gọi API qua mạng nội bộ; ADMIN_ORIGIN dùng kiểm Origin chống CSRF (ADR-027)
      API_INTERNAL_URL: http://api:3000
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:8080}
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    <<: *hardening
    # binary caddy mang file capability cap_net_bind_service → phải giữ lại, nếu không exec bị chặn.
    cap_add: [NET_BIND_SERVICE]
    image: caddy:2.10-alpine
    ports: ['127.0.0.1:8080:8080']
    volumes: [./caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro, caddydata:/data, caddyconfig:/config]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
  caddydata: {}
  caddyconfig: {}
