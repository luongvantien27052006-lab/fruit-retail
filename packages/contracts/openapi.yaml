    FilePresignRequest:
      type: object
      required: [kind, mime, bytes, sha256, capture_source]
      additionalProperties: false
      description: >-
        Ảnh ≤ 5 MB, image/jpeg hoặc image/webp. PHOTO_SPOILAGE, PHOTO_WEIGHT, PHOTO_COMPLAINT (SPEC §8.8) chỉ nhận capture_source = CAMERA (app chụp
        trực tiếp). Khách chỉ được PHOTO_COMPLAINT; loại khác chỉ nhân viên/Master (403). Tối đa 20 file tạo mỗi giờ và 100
        file mỗi ngày mỗi người, mọi trạng thái (429). Thiếu cấu hình S3 ⇒ 503. IMPORT_XLSX (CP04 lát 5): file .xlsx ≤ 5 MB để
        nhập, chỉ Master, capture_source GALLERY; nội dung (zip, công thức, macro) kiểm ở worker khi nhập.
      properties:
        kind:
          type: string
          enum: [PHOTO_SPOILAGE, PHOTO_WEIGHT, PHOTO_COMPLAINT, PHOTO_RECEIPT, PHOTO_PRODUCT, IMPORT_XLSX, BRAND_LOGO]
        mime:
          type: string
          enum: [image/jpeg, image/webp, image/png, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
        bytes:
          type: integer
          minimum: 1
          maximum: 5242880
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        capture_source:
          type: string
          enum: [CAMERA, GALLERY]
        captured_at:
          type: [string, 'null']
          format: date-time
    FilePresignResponse:
      type: object
      required: [id, upload_url, method, headers, expires_at]
      additionalProperties: false
      description: PUT nội dung file vào upload_url trong 5 phút, kèm đúng các header (Content-Type, Content-Length ký trong URL).
      properties:
        id:
          type: string
          format: uuid
        upload_url:
          type: string
        method:
          type: string
          const: PUT
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    FileCompleteResponse:
      type: object
      required: [id, status, reject_reason, bytes, sha256, duplicate_of_id, warnings]
      additionalProperties: false
      description: >-
        Server tự tải lại và tính sha256 + kích thước + định dạng theo byte đầu. Lệch khai báo ⇒ REJECTED (SIZE_MISMATCH,
        SHA256_MISMATCH, CONTENT_TYPE_MISMATCH, EXPIRED). Trùng nội dung với file đã nhận ⇒ READY kèm duplicate_of_id và
        cảnh báo DUPLICATE_CONTENT (FR-INV-16). Chưa PUT ⇒ 409.
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [READY, REJECTED]
        reject_reason:
          type: [string, 'null']
        bytes:
          type: [integer, 'null']
        sha256:
          type: [string, 'null']
        duplicate_of_id:
          type: [string, 'null']
          format: uuid
        warnings:
          type: array
          items:
            type: string
            enum: [DUPLICATE_CONTENT]
    FileDownloadUrlResponse:
      type: object
      required: [url, expires_at]
      additionalProperties: false
      description: Presigned GET 60 giây. Hiện chỉ người tải lên hoặc Master; quyền theo chủ sở hữu thêm khi nghiệp vụ gắn file (CP06+).
