    ApprovalLimitItem:
      type: object
      required: [role, action, allowed, max_amount, max_pct_bp]
      additionalProperties: false
      description: >-
        Cả hai ngưỡng null = không giới hạn; hai ngưỡng: ANY = đạt một (NC-19(c)), ALL = đạt cả hai. allowed=false thì không
        có ngưỡng. DB chặn LINE_DISCOUNT (NC-21), MARKDOWN ngoài MASTER_ADMIN (NC-21), MASTER_ADMIN LINE_DELETE/NO_SALE_OPEN
        (NC-19(d)) ⇒ 400.
      properties:
        role:
          type: string
          enum: [MASTER_ADMIN, STORE_MANAGER, CASHIER, PICKER, WAREHOUSE_STAFF, SHIPPER]
        action:
          type: string
          enum:
            [LINE_DELETE, SALE_VOID, REFUND, SPOILAGE_APPROVE, STOCKTAKE_ADJUST, MANUAL_WEIGHT, NO_SALE_OPEN, MARKDOWN]
        allowed:
          type: boolean
        max_amount:
          type: [integer, 'null']
          minimum: 0
          description: VND
        max_pct_bp:
          type: [integer, 'null']
          minimum: 0
          maximum: 10000
          description: phần trăm theo basis point (10% = 1000)
        limit_mode:
          type: string
          enum: [ANY, ALL]
        same_day_only:
          type: boolean
        requires_pin:
          type: boolean
        requires_note:
          type: boolean
