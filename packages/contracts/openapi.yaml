  /auth/2fa/verify:
    post:
      operationId: postAuth2faVerify
      tags: [auth]
      summary: 'Xác minh TOTP sau login (SEC1) — cần mfa_challenge 5 phút, 1 lần'
      security:
        - mfaChallenge: []
      x-permission: 'mfa:challenge'
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
