# Hợp đồng API — NGUỒN DUY NHẤT (ADR-004, ADR-007). Khung sinh ở CP01; chi tiết schema bổ sung theo x-detail-cp.
openapi: 3.1.0
info:
  title: Fruit Retail API
  version: 0.1.0
  description: |
    API của hệ thống chuỗi bán lẻ hoa quả (SPEC v3.2 §13). Tiền là chuỗi số nguyên VND, khối lượng là gram nguyên.
    `x-permission`: mã quyền §19.6/§21.8; `public` = không cần đăng nhập; `auth:*` = mọi người dùng đã đăng nhập;
    `customer:self`, `settings:write`, `payment:reconcile`, `processing:create`, `complaint:resolve` là mã bổ sung ngoài SPEC, Tiến duyệt 2026-11-17 (CONTEXT NC-08); `mfa:challenge` = token thử thách 2FA 5 phút;
    `approval:by-type` = quyền theo loại yêu cầu (xem x-permission-map); `webhook:*` = xác thực của đối tác (security scheme riêng).
    Phần mở rộng: x-step-up (cần xác thực lại 2FA ≤ 5 phút), x-master-only, x-scope (store = chỉ trong cửa hàng được giao),
    x-assignable-roles, x-permission-by-code (quyền theo mã báo cáo), x-conditional-permissions (quyền con theo nội dung request,
    server kiểm cả trong /pos/sync/upload), x-permission-map (loại yêu cầu duyệt → mã quyền).
    Quy ước lỗi phạm vi: tài nguyên ngoài phạm vi cửa hàng/chủ sở hữu → 404 RESOURCE_NOT_FOUND (không lộ tồn tại);
    403 ACTION_FORBIDDEN chỉ khi bản thân route/hành động bị cấm với vai trò (ví dụ viewer gọi /admin/* — T16).
    Mọi thao tác ghi từ POS/app/admin có Idempotency-Key (§13.1).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /v1
    description: Tiền tố phiên bản (§13.1)
security:
  - bearerAuth: []
tags:
  - name: auth
    description: 'Xác thực (§2.4)'
  - name: app
    description: 'App người dùng (A1)'
  - name: pos
    description: 'POS quầy (A2)'
  - name: fulfillment
    description: 'Soạn đơn (tablet)'
  - name: inventory
    description: 'Kho (A3)'
  - name: shipper
    description: 'Shipper (A5)'
  - name: admin
    description: 'Master Admin (A4)'
  - name: publish
    description: 'Phát hành báo cáo (§10.4)'
  - name: viewer
    description: 'Admin Chỉ Xem — chỉ đọc (§2.5)'
  - name: webhooks
    description: 'Webhook đối tác'
  - name: files
    description: 'File (ADR-014)'
  - name: system
    description: 'Hệ thống'
paths:
  /auth/otp/request:
    post:
      operationId: postAuthOtpRequest
      tags: [auth]
      summary: 'Gửi OTP đăng nhập khách (SEC6) — giới hạn theo SĐT/thiết bị/IP'
      security: []
      x-permission: 'public'
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      description: >-
        Bắt buộc X-Device-Id. Cùng một phản hồi dù SĐT đã có tài khoản hay chưa. Mã mới thay mã cũ. Giới hạn gửi theo SĐT (1/60 giây, 5/giờ, 10/ngày), thiết bị (5/giờ, 20/ngày), IP (IPv4; IPv6 theo /64, /56, /48) và toàn hệ thống (theo giờ và theo ngày); SĐT đang bị khóa xác minh (sai 10 lần/giờ) cũng 429; vượt ⇒ 429 OTP_RATE_LIMITED kèm details.retry_after_s. Chưa cấu hình nhà cung cấp ⇒ 503 CONFIGURATION_NOT_READY; Redis lỗi hoặc gửi lỗi ⇒ 503 DEPENDENCY_UNAVAILABLE.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthOtpRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthOtpRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/otp/verify:
    post:
      operationId: postAuthOtpVerify
      tags: [auth]
      summary: 'Xác minh OTP, cấp token khách'
      security: []
      x-permission: 'public'
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      description: >-
        Bắt buộc X-Device-Id. Mã sai / hết hạn / đã dùng / quá 5 lần nhập ⇒ cùng 401 OTP_INVALID. Sai 10 lần trong một giờ theo SĐT ⇒ 429 OTP_RATE_LIMITED. Lần đầu xác minh đúng ⇒ tạo tài khoản khách. SĐT thuộc tài khoản nội bộ hoặc khách bị khóa ⇒ 403 ACTION_FORBIDDEN.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthOtpVerifyRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthOtpVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: 'Đăng nhập Master/Viewer bằng mật khẩu (bước 1) → mfa_challenge'
      security: []
      x-permission: 'public'
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/2fa/verify:
    post:
      operationId: postAuth2faVerify
      tags: [auth]
      summary: 'Xác minh TOTP sau login (SEC1) — cần mfa_challenge 5 phút, 1 lần'
      security:
        - mfaChallenge: []
      x-permission: 'mfa:challenge'
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCodeRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/2fa/recover:
    post:
      operationId: postAuth2faRecover
      tags: [auth]
      summary: 'Đăng nhập bằng mã khôi phục (dùng 1 lần)'
      security:
        - mfaChallenge: []
      x-permission: 'mfa:challenge'
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      x-not-in-spec-13-2: true # đã duyệt NC-09
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRecoverRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRecoverResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/2fa/setup:
    post:
      operationId: postAuth2faSetup
      tags: [auth]
      summary: 'Bắt đầu đăng ký TOTP (bắt buộc lần đầu với Master/Viewer)'
      x-permission: 'auth:*'
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      x-not-in-spec-13-2: true # đã duyệt NC-09
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTotpSetupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/2fa/confirm:
    post:
      operationId: postAuth2faConfirm
      tags: [auth]
      summary: 'Xác nhận đăng ký TOTP, trả mã khôi phục'
      x-permission: 'auth:*'
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      x-not-in-spec-13-2: true # đã duyệt NC-09
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCodeRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTotpConfirmResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/2fa/recovery-codes:
    post:
      operationId: postAuth2faRecoveryCodes
      tags: [auth]
      summary: 'Sinh lại mã khôi phục'
      x-permission: 'auth:*'
      x-step-up: true
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      x-not-in-spec-13-2: true # đã duyệt NC-09
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRecoveryCodesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/pin:
    post:
      operationId: postAuthPin
      tags: [auth]
      summary: 'Nhân viên đăng nhập mã NV + PIN trên thiết bị đã kích hoạt (SEC3) — ký nonce bằng khóa thiết bị'
      security: []
      x-permission: 'public'
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPinRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPinResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/devices/register:
    post:
      operationId: postAuthDevicesRegister
      tags: [auth]
      summary: 'Thiết bị POS/tablet đăng ký khóa công khai (PENDING chờ kích hoạt)'
      security: []
      x-permission: 'public'
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      x-not-in-spec-13-2: true # đã duyệt NC-09
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosDeviceRegisterRequest'
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosDeviceRegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/step-up:
    post:
      operationId: postAuthStepUp
      tags: [auth]
      summary: 'Xác thực lại 2FA, hiệu lực 5 phút (SEC2)'
      description: >-
        Đếm sai theo PHIÊN (ADR-030): sai 5 lần ⇒ phiên bị thu hồi (401 SESSION_REVOKED). Khóa đăng nhập do người khác
        nhập sai mật khẩu KHÔNG chặn step-up của phiên đã đăng nhập.
      x-permission: 'auth:*'
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCodeRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStepUpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/refresh:
    post:
      operationId: postAuthRefresh
      tags: [auth]
      summary: 'Xoay vòng refresh token theo họ (SEC4); staff bắt buộc X-Device-Id'
      security: []
      x-permission: 'public'
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/password:
    post:
      operationId: postAuthPassword
      tags: [auth]
      summary: 'Đổi mật khẩu (Master/Viewer) — mật khẩu tạm phải đổi trước khi đăng ký 2FA'
      description: >-
        Mật khẩu hiện tại sai ⇒ 422 CURRENT_PASSWORD_INVALID và tính một lần sai (khóa SEC5). Mật khẩu tạm quá 72 giờ ⇒ 403 ACTION_FORBIDDEN (nhờ Master cấp lại); refresh phiên đó ⇒ 401 SESSION_REVOKED. Thành công cũng vô hiệu mọi mfa_challenge còn treo. Mật khẩu mới 12–256 ký tự, khác mật khẩu cũ, không
        chứa tên email. Thành công ⇒ thu hồi mọi phiên KHÁC của tài khoản. Đi được khi phiên chưa có 2FA (ENROLLMENT_REQUIRED).
      x-permission: 'auth:*'
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      x-not-in-spec-13-2: true # Tiến duyệt NC-22 (2026-11-27)
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasswordRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPasswordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: 'Thu hồi phiên hiện tại'
      x-permission: 'auth:*'
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/sessions:
    get:
      operationId: getAuthSessions
      tags: [auth]
      summary: 'Danh sách phiên của chính mình theo thiết bị (SEC4)'
      x-permission: 'auth:*'
      x-spec-ref: '§2.4'
      x-detail-cp: CP03
      x-not-in-spec-13-2: true # đã duyệt NC-09
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/sessions/{id}:
    parameters:
      - name: id
