          type: integer
          minimum: 0
        global:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,18}$'
          format: vnd
        stores:
          type: [array, 'null']
          maxItems: 200
          items:
            $ref: '#/components/schemas/StorePriceInput'
        units:
          type: [array, 'null']
          maxItems: 20
          items:
            $ref: '#/components/schemas/UnitPriceInput'
    PriceBulkResult:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SkuPrices'
    SkuPrices:
      type: object
      description: Giá hiện hành; stores chỉ gồm cửa hàng trong phạm vi price:read của người gọi. price_field cho biết global / stores[].price là giá/kg hay giá/đơn vị. version tăng mỗi lần đổi giá.
      required: [sku_id, sale_unit_type, price_field, version, global, stores, units]
      additionalProperties: false
      properties:
        sku_id:
          type: string
          format: uuid
        sale_unit_type:
          $ref: '#/components/schemas/SaleUnitType'
        price_field:
          type: string
          enum: [PER_KG, PER_UNIT]
        version:
          type: integer
          minimum: 0
        global:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,18}$'
          format: vnd
        stores:
          type: array
          items:
            $ref: '#/components/schemas/SkuStorePrice'
        units:
          type: array
          items:
            $ref: '#/components/schemas/SkuUnitPrice'
    SkuStorePrice:
      type: object
      required: [store_id, price, updated_at]
      additionalProperties: false
      properties:
        store_id:
          type: string
          format: uuid
        price:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,18}$'
          format: vnd
        updated_at:
          type: string
          format: date-time
    SkuUnitPrice:
      type: object
      required: [sku_unit_id, name, for_sale, archived_at, price]
      additionalProperties: false
      properties:
        sku_unit_id:
          type: string
          format: uuid
        name:
          type: string
        for_sale:
          type: boolean
        archived_at:
          type: [string, 'null']
          format: date-time
        price:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,18}$'
          format: vnd
    PriceHistory:
      type: object
      required: [items, next_before]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PriceChangeLog'
        next_before:
          type: [string, 'null']
          format: uuid
    PriceChangeLog:
      type: object
      description: Bản ghi lịch sử giá (chỉ thêm). changed_at là mốc server, tăng nghiêm ngặt theo từng khóa giá. new_value null = bỏ giá riêng.
      required: [id, scope, field, store_id, sku_unit_id, old_value, new_value, reason, changed_by, changed_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [GLOBAL, STORE]
        field:
          type: string
          enum: [PER_KG, PER_UNIT, SKU_UNIT]
        store_id:
          type: [string, 'null']
          format: uuid
        sku_unit_id:
          type: [string, 'null']
          format: uuid
        old_value:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,18}$'
          format: vnd
        new_value:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,18}$'
          format: vnd
        reason:
          type: string
        changed_by:
          type: string
          format: uuid
        changed_at:
          type: string
          format: date-time
    EffectivePrice:
      type: object
      description: >-
        Giá hiệu lực tại thời điểm at, dựng lại từ lịch sử: giá riêng đơn vị (nếu hỏi sku_unit_id và đơn vị có) → giá riêng cửa hàng
        (nếu hỏi store_id — ngoài phạm vi / không tồn tại ⇒ 404) → giá chung. source NONE = chưa có giá. changed_at là mốc
        server lúc ghi lịch sử (ghi cuối transaction, trước COMMIT tối đa vài giây) ⇒ at trong quá khứ là xấp xỉ ở biên; nguồn
        đối soát giao dịch là giá chụp trên dòng bán. Không truyền at ⇒ bản ghi mới nhất đã COMMIT (giá hiện hành, mốc giờ DB).
        Mốc trả về đủ micro-giây. Trả giá cả khi đơn vị / SKU đã lưu trữ hoặc không để bán — POS/app tự kiểm còn bán được không.
        Đơn vị không có giá riêng ⇒ trả giá/kg hoặc giá/đơn vị gốc; client nhân hệ số quy đổi của đơn vị.
      required: [at, field, source, price, changed_at]
      additionalProperties: false
      properties:
        at:
          type: string
          format: date-time
        field:
          type: string
          enum: [PER_KG, PER_UNIT, SKU_UNIT]
        source:
          type: string
          enum: [SKU_UNIT, STORE, GLOBAL, NONE]
        price:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,18}$'
          format: vnd
        changed_at:
          type: [string, 'null']
          format: date-time
    OpeningHours:
      type: object
      description: >-
        Giờ mở cửa theo thứ (mon…sun), mỗi ngày tối đa 3 khung [bắt đầu, kết thúc] HH:MM (kết thúc tối đa 24:00), tăng dần,
        không chồng nhau. Thiếu ngày = nghỉ.
      additionalProperties: false
      properties:
        mon:
          type: array
          maxItems: 3
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
              pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
        tue:
          type: array
          maxItems: 3
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
              pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
        wed:
          type: array
          maxItems: 3
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
              pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
        thu:
          type: array
          maxItems: 3
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
              pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
        fri:
          type: array
          maxItems: 3
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
              pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
        sat:
          type: array
          maxItems: 3
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
              pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
        sun:
          type: array
          maxItems: 3
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
              pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
