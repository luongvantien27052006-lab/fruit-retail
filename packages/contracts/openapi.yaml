components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token 15 phút, EdDSA (SEC4, ADR-012)
    mfaChallenge:
      type: http
      scheme: bearer
      description: Token thử thách 2FA từ /auth/login, 5 phút, dùng 1 lần (ADR-012)
    sepayWebhook:
      type: apiKey
      in: header
      name: Authorization
      description: API key webhook SePay theo tài liệu SePay; kiểm thời gian chống replay (§13.4, ADR-009)
    courierWebhook:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: Chữ ký/secret riêng từng đối tác 3PL (§13.6)
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID; cùng key + khác body → 409 IDEMPOTENCY_CONFLICT (ADR-007)
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: Thiết bị đã kích hoạt (SEC3)
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 'Yêu cầu không hợp lệ'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'Chưa xác thực / cần 2FA'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Không có quyền / cần step-up'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'Không tìm thấy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'Xung đột phiên bản / idempotency / trạng thái'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 'Vi phạm quy tắc nghiệp vụ'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 'Vượt giới hạn tần suất'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 'Thiếu cấu hình hoặc đối tác không sẵn sàng — không phải bằng chứng thất bại thanh toán'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    VndAmount:
      type: string
      pattern: '^-?[0-9]{1,18}$'
      format: vnd
      description: Tiền VND nguyên, chuỗi (FR-INV-01). Sinh ra bigint (TS) / int (Dart).
      examples: ['114950']
    Grams:
      type: integer
      format: int32
      minimum: 0
      description: Khối lượng gram nguyên (FR-INV-02)
    Uuid:
      type: string
      format: uuid
    HealthStatus:
      type: object
      required: [status, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
        checks:
          type: object
          required: [db, redis]
          additionalProperties: false
          properties:
            db:
              type: string
              enum: [ok, down]
            redis:
              type: string
              enum: [ok, down]
    EmptyRequest:
      type: object
      description: Thân rỗng `{}` (route không nhận tham số).
      additionalProperties: false
    OkResponse:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
    AuthLoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Không phân biệt hoa/thường (server chuẩn hóa chữ thường)
        password:
          type: string
          minLength: 1
          maxLength: 256
    AuthCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
          description: Mã TOTP 6 số; mã đã dùng (cùng bước 30 s hoặc cũ hơn) bị từ chối
    AuthRecoverRequest:
      type: object
      required: [recovery_code]
      additionalProperties: false
      properties:
        recovery_code:
          type: string
          minLength: 16
          maxLength: 40
          description: '`xxxx-xxxx-xxxx-xxxx`, không phân biệt hoa/thường, gạch/khoảng trắng bỏ qua'
    AuthRefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 128
        device_proof:
          $ref: '#/components/schemas/DeviceProof'
          description: Bắt buộc với phiên nhân viên POS (mục đích refresh, kèm X-Device-Id của phiên)
    AuthAmr:
      type: string
      enum: [pwd, otp, rcv, pin]
      description: 'Phương thức xác thực của phiên: pwd mật khẩu, otp TOTP, rcv mã khôi phục, pin PIN nhân viên trên thiết bị POS'
    AuthTokenPair:
      type: object
      required: [access_token, access_token_expires_at, refresh_token, session_id, amr]
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: JWT EdDSA 15 phút (header kid, typ at+jwt) — ADR-012
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          description: 256 bit, dùng MỘT lần (xoay vòng); dùng lại ⇒ thu hồi cả phiên
        session_id:
          type: string
          format: uuid
        amr:
          type: array
          items:
            $ref: '#/components/schemas/AuthAmr'
    AuthLoginResponse:
      description: |
        MFA_REQUIRED — đã bật 2FA: gọi /auth/2fa/verify hoặc /auth/2fa/recover với `Authorization: Bearer <mfa_challenge>`
        (5 phút, 1 lần, tối đa 5 lần thử). ENROLLMENT_REQUIRED — chưa đăng ký 2FA: phiên chỉ gọi được /auth/2fa/setup,
        /auth/2fa/confirm, /auth/logout (route khác ⇒ 403 TWO_FACTOR_ENROLLMENT_REQUIRED).
      oneOf:
        - type: object
          required: [status, mfa_challenge, mfa_challenge_expires_at]
          additionalProperties: false
          properties:
            status:
              type: string
              const: MFA_REQUIRED
            mfa_challenge:
              type: string
            mfa_challenge_expires_at:
              type: string
              format: date-time
        - type: object
          required: [status, access_token, access_token_expires_at, refresh_token, session_id, amr]
          additionalProperties: false
          properties:
            status:
              type: string
              const: ENROLLMENT_REQUIRED
            access_token:
              type: string
            access_token_expires_at:
              type: string
              format: date-time
            refresh_token:
              type: string
            session_id:
              type: string
              format: uuid
            amr:
              type: array
              items:
                $ref: '#/components/schemas/AuthAmr'
    AuthRecoverResponse:
      type: object
      required: [access_token, access_token_expires_at, refresh_token, session_id, amr, recovery_codes_remaining]
      additionalProperties: false
      properties:
        access_token:
          type: string
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        session_id:
          type: string
          format: uuid
        amr:
          type: array
          items:
            $ref: '#/components/schemas/AuthAmr'
        recovery_codes_remaining:
          type: integer
          minimum: 0
          maximum: 10
    AuthTotpSetupResponse:
      type: object
      required: [secret, otpauth_uri, issuer]
      additionalProperties: false
      properties:
        secret:
          type: string
          description: Base32 — chỉ trả MỘT lần lúc đăng ký; lưu mã hóa AES-256-GCM (ADR-015)
        otpauth_uri:
          type: string
          description: 'otpauth://totp/… để hiển thị QR'
        issuer:
          type: string
    AuthTotpConfirmResponse:
      type: object
      required: [recovery_codes, access_token, access_token_expires_at, session_id, amr]
      additionalProperties: false
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
          description: 10 mã dùng một lần — chỉ hiện MỘT lần
        access_token:
          type: string
        access_token_expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
        amr:
          type: array
          items:
            $ref: '#/components/schemas/AuthAmr'
    AuthRecoveryCodesResponse:
      type: object
      required: [recovery_codes]
      additionalProperties: false
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
    AuthStepUpResponse:
      type: object
      required: [step_up_until, access_token, access_token_expires_at]
      additionalProperties: false
      properties:
        step_up_until:
          type: string
          format: date-time
        access_token:
          type: string
        access_token_expires_at:
          type: string
          format: date-time
    AuthSession:
      type: object
      required: [id, created_at, last_used_at, expires_at, client_device, user_agent, amr, current]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        client_device:
          type: [string, 'null']
        user_agent:
          type: [string, 'null']
        amr:
          type: array
          items:
            $ref: '#/components/schemas/AuthAmr'
        current:
          type: boolean
    AuthSessionList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AuthSession'
    DeviceProof:
      type: object
      description: |
        Chữ ký thiết bị POS (SEC3, ADR-022). Thông điệp ký (UTF-8, nối bằng "\n"):
        `fruit-device-proof/v1`, mục đích (`register` | `pin` | `refresh`), X-Device-Id (chữ thường), `ts`, `nonce`, ràng buộc.
        Ràng buộc: register = `store_code` + "\n" + `public_key`; pin = mã NV đã chuẩn hóa (trim, chữ HOA);
        refresh = base64url(SHA-256(refresh_token)). `ts` lệch đồng hồ server quá 120 s ⇒ 401; nonce dùng lại ⇒ 401.
      required: [ts, nonce, signature]
      additionalProperties: false
      properties:
        ts:
          type: integer
          minimum: 1
          description: epoch giây theo đồng hồ thiết bị
        nonce:
          type: string
          pattern: '^[A-Za-z0-9_-]{22,43}$'
          description: 16–32 byte ngẫu nhiên, base64url không đệm, mỗi request một nonce mới
        signature:
          type: string
          pattern: '^[A-Za-z0-9_-]{86}$'
          description: chữ ký Ed25519 64 byte của thông điệp, base64url không đệm
    AuthPinRequest:
      type: object
      required: [staff_code, pin, device_proof]
      additionalProperties: false
      properties:
        staff_code:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,32}$'
          description: Mã nhân viên (không phân biệt hoa/thường)
        pin:
          type: string
          pattern: '^\d{6}$'
        device_proof:
          $ref: '#/components/schemas/DeviceProof'
    StaffRoleSpec:
      type: object
      required: [role]
      additionalProperties: false
      description: Vai trò cửa hàng cần store_id; WAREHOUSE_STAFF cần warehouse_id. Cửa hàng trưởng chỉ gán CASHIER, PICKER ở cửa hàng mình.
      properties:
        role:
          type: string
          enum: [STORE_MANAGER, CASHIER, PICKER, SHIPPER, WAREHOUSE_STAFF]
        store_id:
          type: [string, 'null']
          format: uuid
        warehouse_id:
          type: [string, 'null']
          format: uuid
    StaffCreateRequest:
      type: object
      required: [staff_code, full_name, pin, role]
      additionalProperties: false
      properties:
        staff_code:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,32}$'
          description: chuẩn hóa chữ HOA; DB yêu cầu 2–20 ký tự [A-Z0-9_-]
        full_name:
          type: string
          minLength: 1
          maxLength: 100
        pin:
          type: string
          pattern: '^[0-9]{6}$'
          description: PIN 6 số; PIN dễ đoán (lặp, dãy liên tiếp, phổ biến) bị từ chối 400
        hired_at:
          type: [string, 'null']
          format: date
        role:
          $ref: '#/components/schemas/StaffRoleSpec'
    StaffUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Đổi PIN hoặc khóa (DISABLED) ⇒ thu hồi mọi phiên của nhân viên. Không tự sửa chính mình.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 100
        hired_at:
          type: [string, 'null']
          format: date
        left_at:
          type: [string, 'null']
          format: date
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        pin:
          type: string
          pattern: '^[0-9]{6}$'
    StaffRoleAssignment:
      type: object
      required: [id, role, scope_type, store_id, warehouse_id]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
        scope_type:
          type: string
          enum: [ALL, STORE, WAREHOUSE]
        store_id:
          type: [string, 'null']
          format: uuid
        warehouse_id:
          type: [string, 'null']
          format: uuid
    Staff:
      type: object
      required: [user_id, staff_code, full_name, hired_at, left_at, status, roles]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        staff_code:
          type: string
        full_name:
          type: string
        hired_at:
          type: [string, 'null']
          format: date
        left_at:
          type: [string, 'null']
          format: date
        status:
          type: string
          enum: [ACTIVE, LOCKED, DISABLED]
        roles:
          type: array
          items:
            $ref: '#/components/schemas/StaffRoleAssignment'
    StaffList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Staff'
    RoleAssignmentRequest:
      type: object
      required: [user_id, role]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [STORE_MANAGER, CASHIER, PICKER, SHIPPER, WAREHOUSE_STAFF]
        store_id:
          type: [string, 'null']
          format: uuid
        warehouse_id:
          type: [string, 'null']
          format: uuid
    RoleAssignment:
      type: object
      required: [id, user_id, role, store_id, warehouse_id, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
        store_id:
          type: [string, 'null']
          format: uuid
        warehouse_id:
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
    ApprovalLimitItem:
      type: object
      required: [role, action, allowed, max_amount, max_pct_bp]
      additionalProperties: false
      description: >-
        Cả hai ngưỡng null = không giới hạn; hai ngưỡng: ANY = đạt một (NC-19(c)), ALL = đạt cả hai. allowed=false thì không
        có ngưỡng. DB chặn LINE_DISCOUNT (NC-21), MARKDOWN ngoài MASTER_ADMIN (NC-21), MASTER_ADMIN LINE_DELETE/NO_SALE_OPEN
        (NC-19(d)) ⇒ 400.
      properties:
        role:
          type: string
          enum: [MASTER_ADMIN, STORE_MANAGER, CASHIER, PICKER, WAREHOUSE_STAFF, SHIPPER]
        action:
          type: string
          enum: [LINE_DELETE, SALE_VOID, REFUND, SPOILAGE_APPROVE, STOCKTAKE_ADJUST, MANUAL_WEIGHT, NO_SALE_OPEN, MARKDOWN]
        allowed:
          type: boolean
        max_amount:
          type: [integer, 'null']
          minimum: 0
          description: VND
        max_pct_bp:
          type: [integer, 'null']
          minimum: 0
          maximum: 10000
          description: phần trăm theo basis point (10% = 1000)
        limit_mode:
          type: string
          enum: [ANY, ALL]
        same_day_only:
          type: boolean
        requires_pin:
          type: boolean
        requires_note:
          type: boolean
    ApprovalLimitsPutRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/ApprovalLimitItem'
    ApprovalLimitsResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalLimitItem'
    AuthOtpRequest:
      type: object
      required: [phone]
      additionalProperties: false
      properties:
        phone:
          type: string
          minLength: 9
          maxLength: 20
          pattern: '^[+0-9 .-]+$'
          description: SĐT di động Việt Nam (0912…, 84912…, +84912…); server chuẩn hóa E.164
    AuthOtpRequestResponse:
      type: object
      required: [expires_at, resend_after_s]
      additionalProperties: false
      properties:
        expires_at:
          type: string
          format: date-time
        resend_after_s:
          type: integer
          minimum: 1
    AuthOtpVerifyRequest:
      type: object
      required: [phone, code]
      additionalProperties: false
      properties:
        phone:
          type: string
          minLength: 9
          maxLength: 20
          pattern: '^[+0-9 .-]+$'
        code:
          type: string
          pattern: '^[0-9]{6}$'
    AuthOtpVerifyResponse:
      description: Phiên khách 60 ngày tuyệt đối (refresh không gia hạn); amr = [otp].
      type: object
      required: [access_token, access_token_expires_at, refresh_token, session_id, amr, customer]
      additionalProperties: false
      properties:
        access_token:
          type: string
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        session_id:
          type: string
          format: uuid
        amr:
          type: array
          items:
            $ref: '#/components/schemas/AuthAmr'
        customer:
          type: object
          required: [user_id, is_new]
          additionalProperties: false
          properties:
            user_id:
              type: string
              format: uuid
            is_new:
              type: boolean
    AuthPinResponse:
      description: |
        Phiên nhân viên gắn thiết bị, hạn tuyệt đối 24 giờ (refresh không gia hạn). Mọi request sau phải gửi X-Device-Id của
        thiết bị này; /auth/refresh kèm `device_proof`. Sai mã NV / sai PIN / tạm khóa / không thuộc cửa hàng của thiết bị ⇒
        cùng một lỗi 401.
      type: object
      required: [access_token, access_token_expires_at, refresh_token, session_id, amr, staff, device_id]
      additionalProperties: false
      properties:
        access_token:
          type: string
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        session_id:
          type: string
          format: uuid
        amr:
          type: array
          items:
            $ref: '#/components/schemas/AuthAmr'
        device_id:
          type: string
          format: uuid
        staff:
          type: object
          required: [user_id, staff_code, full_name]
          additionalProperties: false
          properties:
            user_id:
              type: string
              format: uuid
            staff_code:
              type: string
            full_name:
              type: string
    PosDeviceRegisterRequest:
      type: object
      description: >-
        X-Device-Id = UUID do thiết bị tự sinh một lần (thành `device_id`). Cửa hàng lấy từ mã ghi danh (không gửi mã
        cửa hàng). Ràng buộc chữ ký `register` = mã ghi danh dạng chuẩn (chữ HOA, bỏ gạch) + `\n` + public_key. Mã sai,
        đã dùng, hết hạn hoặc cửa hàng ngừng hoạt động ⇒ cùng một lỗi 401.
      required: [enrollment_code, name, platform, public_key, device_proof]
      additionalProperties: false
      properties:
        enrollment_code:
          type: string
          pattern: '^[A-Za-z2-7]{4}-?[A-Za-z2-7]{4}-?[A-Za-z2-7]{4}$'
          description: mã ghi danh dùng một lần do Master/cửa hàng trưởng tạo (POST /admin/pos-devices/enrollment-codes)
        name:
          type: string
          minLength: 1
          maxLength: 100
        platform:
          type: string
          enum: [windows, android]
        public_key:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: khóa công khai Ed25519 thô 32 byte, base64url không đệm
        device_proof:
          $ref: '#/components/schemas/DeviceProof'
    PosEnrollmentCodeRequest:
      type: object
      required: [store_id]
      additionalProperties: false
      properties:
        store_id:
          type: string
          format: uuid
    PosEnrollmentCodeResponse:
      type: object
      description: Mã rõ chỉ trả một lần (server chỉ lưu SHA-256); dùng một lần, hạn 30 phút.
      required: [id, store_id, code, expires_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[A-Z2-7]{4}-[A-Z2-7]{4}-[A-Z2-7]{4}$'
        expires_at:
          type: string
          format: date-time
    PosDeviceRegisterResponse:
      type: object
      required: [device_id, status, pairing_code, registered_at]
      additionalProperties: false
      properties:
        device_id:
          type: string
          format: uuid
        status:
          type: string
          const: PENDING
        pairing_code:
          type: string
          pattern: '^[A-Z2-7]{5}-[A-Z2-7]{5}$'
          description: Hiển thị trên thiết bị (50 bit fingerprint khóa); người kích hoạt nhập mã đọc từ máy — API danh sách không trả mã này
        registered_at:
          type: string
          format: date-time
    PosDevice:
      type: object
      required:
        [
          id,
          store_id,
          register_id,
          name,
          platform,
          status,
          registered_at,
          activated_at,
          revoked_at,
          revoke_reason,
          last_seen_at,
        ]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
        register_id:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        platform:
          type: string
        status:
          type: string
          enum: [PENDING, ACTIVE, REVOKED]
        registered_at:
          type: string
          format: date-time
        activated_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        revoke_reason:
          type: [string, 'null']
        last_seen_at:
          type: [string, 'null']
          format: date-time
    PosDeviceList:
      type: object
      description: |
        Tối đa 200 thiết bị mới nhất trong phạm vi cửa hàng của người gọi. PENDING quá 7 ngày không bao giờ hiện; mặc định
        (không lọc status) ẩn REVOKED — lọc status=REVOKED để xem.
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PosDevice'
    PosDeviceActivateRequest:
      type: object
      required: [pairing_code]
      additionalProperties: false
      properties:
        pairing_code:
          type: string
          pattern: '^[A-Za-z2-7]{5}-?[A-Za-z2-7]{5}$'
        register_id:
          type: [string, 'null']
          format: uuid
          description: Quầy thuộc cùng cửa hàng của thiết bị
        name:
          type: string
          minLength: 1
          maxLength: 100
