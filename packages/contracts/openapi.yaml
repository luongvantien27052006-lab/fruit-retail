      additionalProperties: false
      description: >-
        Đổi PIN hoặc khóa (DISABLED) ⇒ thu hồi mọi phiên của nhân viên. Không tự sửa chính mình. Đổi `status` hoặc `pin` bởi Master
        cần step-up còn hạn (403 STEP_UP_REQUIRED); tài khoản LOCKED không mở bằng PATCH (409 — dùng /admin/users/{id}/unlock).
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 100
        hired_at:
          type: [string, 'null']
          format: date
        left_at:
          type: [string, 'null']
          format: date
        status:
          type: string
