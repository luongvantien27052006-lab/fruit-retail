components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token 15 phút, EdDSA (SEC4, ADR-012)
    mfaChallenge:
      type: http
      scheme: bearer
      description: Token thử thách 2FA từ /auth/login, 5 phút, dùng 1 lần (ADR-012)
    sepayWebhook:
      type: apiKey
      in: header
      name: Authorization
      description: API key webhook SePay theo tài liệu SePay; kiểm thời gian chống replay (§13.4, ADR-009)
    courierWebhook:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: Chữ ký/secret riêng từng đối tác 3PL (§13.6)
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID; cùng key + khác body → 409 IDEMPOTENCY_CONFLICT (ADR-007)
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
    ClientDeviceId:
      name: X-Device-Id
      in: header
      required: false
      description: >-
        Định danh trình duyệt / app (không phải thiết bị POS): admin-web gửi cookie `__Host-fa_dev` (ngẫu nhiên, base64url 32 ký
        tự). Ghi vào `sessions.client_device`; dùng nhận ra đăng nhập từ thiết bị đã thấy (không phát `auth.new_device_login`).
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{8,128}$'
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: Thiết bị đã kích hoạt (SEC3)
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 'Yêu cầu không hợp lệ'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'Chưa xác thực / cần 2FA'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Không có quyền / cần step-up'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'Không tìm thấy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'Xung đột phiên bản / idempotency / trạng thái'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 'Vi phạm quy tắc nghiệp vụ'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 'Vượt giới hạn tần suất'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 'Thiếu cấu hình hoặc đối tác không sẵn sàng — không phải bằng chứng thất bại thanh toán'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    SaleUnitType:
      type: string
      description: Kiểu bán §4.2 — bất biến sau khi tạo SKU
      enum: [WEIGHT, PIECE_BY_WEIGHT, PIECE_FIXED, PACK_FIXED, PACK_VARIABLE, BUNDLE, SERVICE]
    Unit:
      type: object
      description: >-
        Đơn vị tính (§21.3.1). Mã, loại, số gram cố định bất biến.
      required: [code, name, kind, fixed_g, archived_at]
      additionalProperties: false
      properties:
        code:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [WEIGHT, COUNT]
        fixed_g:
          type: [integer, 'null']
          description: đơn vị khối lượng — số gram cố định (kg = 1000)
        archived_at:
          type: [string, 'null']
          format: date-time
    UnitList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Unit'
    UnitCreateRequest:
      type: object
      description: >-
        kind WEIGHT ⇒ bắt buộc fixed_g; COUNT ⇒ không có (422).
      required: [code, name, kind]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,15}$'
          description: chuẩn hóa chữ HOA
        name:
          type: string
          minLength: 1
          maxLength: 50
        kind:
          type: string
          enum: [WEIGHT, COUNT]
        fixed_g:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000000
    UnitUpdateRequest:
      type: object
      description: >-
        Đơn vị gốc mặc định của SKU (KG, PIECE, PACK, BASKET, SERVICE) không lưu trữ được (422).
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        archived:
          type: boolean
          description: true = lưu trữ (không xóa); false = dùng lại
    Category:
      type: object
      description: >-
        Cây danh mục §4.1 (tối đa 5 cấp, không vòng).
      required: [id, parent_id, name, sort, created_at, updated_at, archived_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        sort:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: [string, 'null']
          format: date-time
    CategoryList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    CategoryCreateRequest:
      type: object
      description: >-
        Cha đã lưu trữ / không tồn tại ⇒ 422; trùng tên cùng cha ⇒ 409.
      required: [name]
      additionalProperties: false
      properties:
        parent_id:
          type: [string, 'null']
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        sort:
          type: integer
          minimum: 0
          maximum: 1000000
    CategoryUpdateRequest:
      type: object
      description: >-
        Lưu trữ khi còn danh mục con / sản phẩm đang dùng ⇒ 422; đổi cha tạo vòng hoặc sâu quá 5 cấp ⇒ 422.
      additionalProperties: false
      minProperties: 1
      properties:
        parent_id:
          type: [string, 'null']
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        sort:
          type: integer
          minimum: 0
          maximum: 1000000
        archived:
          type: boolean
          description: true = lưu trữ (không xóa); false = dùng lại
    Product:
      type: object
      description: >-
        Sản phẩm §4.1 (nhóm các SKU cùng loại hàng).
      required: [id, category_id, name, description, origin, created_at, updated_at, archived_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        origin:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: [string, 'null']
          format: date-time
    ProductList:
      type: object
      description: tối đa 1000 sản phẩm theo tên — lọc bằng category_id / q khi danh mục lớn hơn
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    ProductCreateRequest:
      type: object
      description: >-
        Danh mục đã lưu trữ / không tồn tại ⇒ 422.
      required: [category_id, name]
      additionalProperties: false
      properties:
        category_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 2000
        origin:
          type: [string, 'null']
          maxLength: 100
    ProductUpdateRequest:
      type: object
      description: >-
        Lưu trữ khi còn SKU đang dùng ⇒ 422.
      additionalProperties: false
      minProperties: 1
      properties:
        category_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 2000
        origin:
          type: [string, 'null']
          maxLength: 100
        archived:
          type: boolean
          description: true = lưu trữ (không xóa); false = dùng lại
    SkuUnit:
      type: object
      description: >-
        Đơn vị bán/mua dùng chung tồn (§21.3.1): đúng một cách quy đổi — factor_g (tồn gram), factor_units (tồn đếm), is_variable (thùng/sọt danh nghĩa, cân thực khi nhận, chỉ để mua). Hệ số và mã đơn vị bất biến.
      required:
        [
          id,
          sku_id,
          unit_code,
          name,
          factor_g,
          factor_units,
          is_variable,
          for_sale,
          for_purchase,
          barcode,
          price_per_unit,
          created_at,
          updated_at,
          archived_at,
        ]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sku_id:
          type: string
          format: uuid
        unit_code:
          type: string
        name:
          type: string
        factor_g:
          type: [integer, 'null']
        factor_units:
          type: [integer, 'null']
        is_variable:
          type: boolean
        for_sale:
          type: boolean
        for_purchase:
          type: boolean
        barcode:
          type: [string, 'null']
        price_per_unit:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,18}$'
          format: vnd
          description: giá riêng của đơn vị (đổi qua /admin/prices — lát 3); null = tính theo giá SKU
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: [string, 'null']
          format: date-time
    SkuUnitCreateRequest:
      type: object
      description: >-
        Sai kiểu bán / sai loại đơn vị (vd. đơn vị đếm cho hàng chỉ tồn gram, danh nghĩa để bán, dịch vụ để mua) ⇒ 422 CATALOG_RULE_VIOLATION.
      required: [unit_code, name, for_sale, for_purchase]
      additionalProperties: false
      properties:
        unit_code:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,15}$'
          description: chuẩn hóa chữ HOA
        name:
          type: string
          minLength: 1
          maxLength: 100
        factor_g:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000000
        factor_units:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000
        is_variable:
          type: boolean
        for_sale:
          type: boolean
        for_purchase:
          type: boolean
        barcode:
          type: [string, 'null']
          pattern: '^[0-9A-Za-z-]{4,32}$'
          description: chuẩn hóa chữ HOA; mã 13 số bắt đầu bằng 2 (tem cân) bị từ chối; mã toàn số 8/12/13/14 kiểm số kiểm tra GS1 (422 BARCODE_CHECKSUM_INVALID)
    SkuUnitUpdateRequest:
      type: object
      description: >-
        SKU đang dùng phải còn ít nhất một đơn vị bán đang dùng (422). Bỏ "để bán" khi đơn vị có giá riêng ⇒ 422.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        for_sale:
          type: boolean
        for_purchase:
          type: boolean
        barcode:
          type: [string, 'null']
          pattern: '^[0-9A-Za-z-]{4,32}$'
          description: chuẩn hóa chữ HOA; mã 13 số bắt đầu bằng 2 (tem cân) bị từ chối; mã toàn số 8/12/13/14 kiểm số kiểm tra GS1 (422 BARCODE_CHECKSUM_INVALID)
        archived:
          type: boolean
          description: true = lưu trữ (không xóa); false = dùng lại
    Sku:
      type: object
      description: >-
        SKU §4.3. stock_base: đơn vị tồn chuẩn (GRAM hàng cân, COUNT hàng đếm, NONE dịch vụ). Giá chỉ đọc ở đây (đổi qua /admin/prices — lát 3). version chỉ tăng khi sửa chính SKU (PATCH /admin/skus/{id}); thêm/sửa đơn vị qua /admin/skus/{id}/units không tăng version.
      required:
        [
          id,
          product_id,
          sku_code,
          name,
          sale_unit_type,
          stock_base,
          std_weight_g,
          weight_min_g,
          weight_max_g,
          tare_g,
          scale_plu,
          sold_by_scale,
          shelf_life_days,
          storage_note,
          has_ripeness,
          shrink_norm_bps_week,
          is_high_value,
          cold_required,
          alert_days_before_expiry,
          stop_app_days_before_expiry,
          retail_price_per_kg,
          retail_price_per_unit,
          version,
          created_at,
          updated_at,
          archived_at,
          units,
        ]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku_code:
          type: string
        name:
          type: string
        sale_unit_type:
          $ref: '#/components/schemas/SaleUnitType'
        stock_base:
          type: string
          enum: [GRAM, COUNT, NONE]
        std_weight_g:
          type: [integer, 'null']
        weight_min_g:
          type: [integer, 'null']
        weight_max_g:
          type: [integer, 'null']
        tare_g:
          type: [integer, 'null']
        scale_plu:
          type: [string, 'null']
          description: PLU 5 số (khác 00000) — chỉ hàng tính theo kg; unique trong SKU đang dùng
        sold_by_scale:
          type: boolean
        shelf_life_days:
          type: [integer, 'null']
        storage_note:
          type: [string, 'null']
        has_ripeness:
          type: boolean
        shrink_norm_bps_week:
          type: [integer, 'null']
          description: định mức hao hụt/tuần, phần vạn
        is_high_value:
          type: boolean
        cold_required:
          type: boolean
        alert_days_before_expiry:
          type: [integer, 'null']
        stop_app_days_before_expiry:
          type: [integer, 'null']
        retail_price_per_kg:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,18}$'
          format: vnd
        retail_price_per_unit:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,18}$'
          format: vnd
        version:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: [string, 'null']
          format: date-time
        units:
          type: array
          items:
            $ref: '#/components/schemas/SkuUnit'
    SkuList:
      type: object
      required: [items, next_after]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sku'
        next_after:
          type: [string, 'null']
          description: còn trang sau ⇒ truyền vào ?after=
    SkuCreateRequest:
      type: object
      description: >-
        Tạo SKU kèm đơn vị gốc (hàng cân: kg 1000 g; hàng đếm: 1 đơn vị — PIECE/PACK/BASKET/SERVICE, đổi bằng base_unit_code). Thuộc tính sai kiểu bán ⇒ 422 CATALOG_RULE_VIOLATION; trùng mã SKU / PLU / mã vạch ⇒ 409. Không nhận giá (lát 3).
      required: [product_id, sku_code, name, sale_unit_type]
      additionalProperties: false
      properties:
        product_id:
          type: string
          format: uuid
        sku_code:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,31}$'
          description: chuẩn hóa chữ HOA; bất biến
        name:
          type: string
          minLength: 1
          maxLength: 200
        sale_unit_type:
          $ref: '#/components/schemas/SaleUnitType'
        barcode:
          type: [string, 'null']
          pattern: '^[0-9A-Za-z-]{4,32}$'
          description: mã vạch của đơn vị gốc — chuẩn hóa chữ HOA; mã 13 số bắt đầu bằng 2 (tem cân) bị từ chối; mã toàn số 8/12/13/14 kiểm số kiểm tra GS1 (422 BARCODE_CHECKSUM_INVALID)
        base_unit_code:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,15}$'
          description: chuẩn hóa chữ HOA
        units:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/SkuUnitCreateRequest'
        std_weight_g:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000
        weight_min_g:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000
        weight_max_g:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000
        tare_g:
          type: [integer, 'null']
          minimum: 0
          maximum: 20000
        scale_plu:
          type: [string, 'null']
          pattern: '^[0-9]{5}$'
          description: PLU 5 số (khác 00000) — chỉ hàng tính theo kg; unique trong SKU đang dùng
        sold_by_scale:
          type: boolean
        shelf_life_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
        storage_note:
          type: [string, 'null']
          maxLength: 500
        has_ripeness:
          type: boolean
        shrink_norm_bps_week:
          type: [integer, 'null']
          minimum: 0
          maximum: 10000
          description: định mức hao hụt/tuần, phần vạn
        is_high_value:
          type: boolean
        cold_required:
          type: boolean
        alert_days_before_expiry:
          type: [integer, 'null']
          minimum: 0
          maximum: 3650
        stop_app_days_before_expiry:
          type: [integer, 'null']
          minimum: 0
          maximum: 3650
    SkuUpdateRequest:
      type: object
      description: >-
        version phải bằng bản hiện tại (lệch ⇒ 409). Mã SKU, kiểu bán, giá không sửa ở đây. Lưu trữ SKU trả PLU lại; mở lại ⇒ kiểm trùng PLU / mã vạch.
      required: [version]
      additionalProperties: false
      minProperties: 2
      properties:
        version:
          type: integer
          minimum: 0
        product_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        archived:
          type: boolean
          description: true = lưu trữ (không xóa); false = dùng lại
        std_weight_g:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000
        weight_min_g:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000
        weight_max_g:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000
        tare_g:
          type: [integer, 'null']
          minimum: 0
          maximum: 20000
        scale_plu:
          type: [string, 'null']
          pattern: '^[0-9]{5}$'
          description: PLU 5 số (khác 00000) — chỉ hàng tính theo kg; unique trong SKU đang dùng
        sold_by_scale:
          type: boolean
        shelf_life_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
        storage_note:
          type: [string, 'null']
          maxLength: 500
        has_ripeness:
          type: boolean
        shrink_norm_bps_week:
          type: [integer, 'null']
          minimum: 0
          maximum: 10000
          description: định mức hao hụt/tuần, phần vạn
        is_high_value:
          type: boolean
        cold_required:
          type: boolean
        alert_days_before_expiry:
          type: [integer, 'null']
          minimum: 0
          maximum: 3650
        stop_app_days_before_expiry:
          type: [integer, 'null']
          minimum: 0
          maximum: 3650
    PriceSetRequest:
      type: object
      description: >-
        Đặt giá một SKU. global = giá lẻ chung (giá/kg cho WEIGHT, PIECE_BY_WEIGHT, PACK_VARIABLE; giá/đơn vị cho kiểu khác);
        stores[].price null = bỏ giá riêng cửa hàng (về giá chung); units[].price null = bỏ giá riêng của đơn vị. Giá 1 … 1.000.000.000
        đồng, âm / 0 / quá trần ⇒ 422 CATALOG_RULE_VIOLATION. version lệch ⇒ 409. Giá không đổi thì không ghi lịch sử. Đổi giá chỉ
        áp cho giao dịch mới (dòng bán chụp giá lúc bán). Tối đa 2000 giá (chung + cửa hàng + đơn vị) mỗi yêu cầu. Chỉ Master.
        global / stores / units = null coi như không đặt.
      required: [reason, version]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        version:
          type: integer
          minimum: 0
        global:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,18}$'
          format: vnd
        stores:
          type: [array, 'null']
          maxItems: 200
          items:
            $ref: '#/components/schemas/StorePriceInput'
        units:
          type: [array, 'null']
          maxItems: 20
          items:
            $ref: '#/components/schemas/UnitPriceInput'
    StorePriceInput:
      type: object
      required: [store_id, price]
      additionalProperties: false
      properties:
        store_id:
          type: string
          format: uuid
        price:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,18}$'
          format: vnd
    UnitPriceInput:
      type: object
      required: [sku_unit_id, price]
      additionalProperties: false
      properties:
        sku_unit_id:
          type: string
          format: uuid
        price:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,18}$'
          format: vnd
    PriceBulkSetRequest:
      type: object
      description: Nhiều SKU một transaction (tất cả hoặc không); cần step-up; chỉ Master; tối đa 2000 giá cả lô.
      required: [reason, items]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/PriceBulkItem'
    PriceBulkItem:
      type: object
