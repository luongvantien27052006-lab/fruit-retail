    AuthAmr:
      type: string
      enum: [pwd, otp, rcv, pin]
      description: 'Phương thức xác thực của phiên: pwd mật khẩu, otp TOTP, rcv mã khôi phục, pin PIN nhân viên trên thiết bị POS'
    AuthTokenPair:
      type: object
      required: [access_token, access_token_expires_at, refresh_token, session_id, amr]
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: JWT EdDSA 15 phút (header kid, typ at+jwt) — ADR-012
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          description: 256 bit, dùng MỘT lần (xoay vòng); dùng lại ⇒ thu hồi cả phiên
        session_id:
          type: string
          format: uuid
        amr:
          type: array
          items:
            $ref: '#/components/schemas/AuthAmr'
    AuthPasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 256
        new_password:
          type: string
          minLength: 12
          maxLength: 256
    AuthPasswordResponse:
      type: object
      required: [revoked_sessions]
      additionalProperties: false
      properties:
        revoked_sessions:
          type: integer
          minimum: 0
    AuthLoginResponse:
      description: |
        MFA_REQUIRED — đã bật 2FA: gọi /auth/2fa/verify hoặc /auth/2fa/recover với `Authorization: Bearer <mfa_challenge>`
        (5 phút, 1 lần, tối đa 5 lần thử). ENROLLMENT_REQUIRED — chưa đăng ký 2FA: phiên chỉ gọi được /auth/2fa/setup,
        /auth/2fa/confirm, /auth/password, /auth/logout (route khác ⇒ 403 TWO_FACTOR_ENROLLMENT_REQUIRED).
        password_change_required = true (mật khẩu tạm — NC-22) ⇒ phải đổi mật khẩu qua /auth/password trước, 2FA setup/confirm
        trả 403 PASSWORD_CHANGE_REQUIRED. Mật khẩu tạm chưa đổi quá 72 giờ ⇒ đăng nhập 401 chung.
      oneOf:
        - type: object
          required: [status, mfa_challenge, mfa_challenge_expires_at]
          additionalProperties: false
          properties:
            status:
              type: string
              const: MFA_REQUIRED
            mfa_challenge:
              type: string
            mfa_challenge_expires_at:
              type: string
              format: date-time
        - type: object
          required:
            [status, password_change_required, access_token, access_token_expires_at, refresh_token, session_id, amr]
          additionalProperties: false
          properties:
            status:
              type: string
              const: ENROLLMENT_REQUIRED
            password_change_required:
              type: boolean
