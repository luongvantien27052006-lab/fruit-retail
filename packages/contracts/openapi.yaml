      description: Thu hồi thiết bị ⇒ mọi phiên đang mở trên thiết bị bị thu hồi trong cùng transaction.
      type: object
      required: [device, revoked_sessions]
      additionalProperties: false
      properties:
        device:
          $ref: '#/components/schemas/PosDevice'
        revoked_sessions:
          type: integer
          minimum: 0
