    PosDeviceRegisterRequest:
      type: object
      description: >-
        X-Device-Id = UUID do thiết bị tự sinh một lần (thành `device_id`). Cửa hàng lấy từ mã ghi danh (không gửi mã
        cửa hàng). Ràng buộc chữ ký `register` = mã ghi danh dạng chuẩn (chữ HOA, bỏ gạch) + `\n` + public_key. Mã sai,
        đã dùng, hết hạn hoặc cửa hàng ngừng hoạt động ⇒ cùng một lỗi 401.
      required: [enrollment_code, name, platform, public_key, device_proof]
      additionalProperties: false
      properties:
        enrollment_code:
          type: string
          pattern: '^[A-Za-z2-7]{4}-?[A-Za-z2-7]{4}-?[A-Za-z2-7]{4}$'
          description: mã ghi danh dùng một lần do Master/cửa hàng trưởng tạo (POST /admin/pos-devices/enrollment-codes)
        name:
          type: string
          minLength: 1
          maxLength: 100
        platform:
          type: string
          enum: [windows, android]
        public_key:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: khóa công khai Ed25519 thô 32 byte, base64url không đệm
        device_proof:
          $ref: '#/components/schemas/DeviceProof'
    PosEnrollmentCodeRequest:
      type: object
      required: [store_id]
      additionalProperties: false
      properties:
        store_id:
          type: string
          format: uuid
    PosEnrollmentCodeResponse:
      type: object
      description: Mã rõ chỉ trả một lần (server chỉ lưu SHA-256); dùng một lần, hạn 30 phút.
      required: [id, store_id, code, expires_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[A-Z2-7]{4}-[A-Z2-7]{4}-[A-Z2-7]{4}$'
        expires_at:
          type: string
          format: date-time
    PosDeviceRegisterResponse:
      type: object
      required: [device_id, status, pairing_code, registered_at]
      additionalProperties: false
      properties:
        device_id:
          type: string
          format: uuid
        status:
          type: string
          const: PENDING
        pairing_code:
          type: string
          pattern: '^[A-Z2-7]{5}-[A-Z2-7]{5}$'
          description: Hiển thị trên thiết bị (50 bit fingerprint khóa); người kích hoạt nhập mã đọc từ máy — API danh sách không trả mã này
        registered_at:
          type: string
          format: date-time
    PosDevice:
      type: object
      required:
        [
          id,
          store_id,
          register_id,
          name,
          platform,
          status,
          registered_at,
          activated_at,
          revoked_at,
          revoke_reason,
          last_seen_at,
        ]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
        register_id:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        platform:
          type: string
        status:
          type: string
          enum: [PENDING, ACTIVE, REVOKED]
        registered_at:
          type: string
          format: date-time
        activated_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        revoke_reason:
          type: [string, 'null']
        last_seen_at:
          type: [string, 'null']
          format: date-time
    PosDeviceList:
      type: object
      description: |
        Tối đa 200 thiết bị mới nhất trong phạm vi cửa hàng của người gọi. PENDING quá 7 ngày không bao giờ hiện; mặc định
        (không lọc status) ẩn REVOKED — lọc status=REVOKED để xem.
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PosDevice'
    PosDeviceActivateRequest:
      type: object
      required: [pairing_code]
      additionalProperties: false
      properties:
        pairing_code:
          type: string
          pattern: '^[A-Za-z2-7]{5}-?[A-Za-z2-7]{5}$'
        register_id:
          type: [string, 'null']
          format: uuid
          description: Quầy thuộc cùng cửa hàng của thiết bị
        name:
          type: string
          minLength: 1
          maxLength: 100
    PosDeviceRevokeRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    PosDeviceRevokeResponse:
      description: Thu hồi thiết bị ⇒ mọi phiên đang mở trên thiết bị bị thu hồi trong cùng transaction.
      type: object
      required: [device, revoked_sessions]
      additionalProperties: false
      properties:
        device:
          $ref: '#/components/schemas/PosDevice'
        revoked_sessions:
          type: integer
          minimum: 0
