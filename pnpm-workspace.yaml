packages:
  - apps/api
  - apps/admin-web
  - packages/contracts
  - packages/money_weight/ts
  - packages/api_client_ts

# Bảo vệ chuỗi cung ứng (pnpm 11): chỉ gói đã phát hành đủ lâu; chỉ cho phép script cài đặt của gói cần thiết.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  '@swc/core': true
  cpu-features: false
  protobufjs: false
  ssh2: false

# Bảo vệ chuỗi cung ứng (ghi rõ, không dựa mặc định): gói phải phát hành ≥ 24 giờ; gói mới có script cài đặt → lỗi.
minimumReleaseAge: 1440
strictDepBuilds: true
